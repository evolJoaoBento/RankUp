<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RankUp</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3f93b8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=24" />
</head>
<body>

<!-- AUTH -->
<div id="auth" class="auth">
  <div class="auth__card">
    <div class="brand brand--big"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13 L12 6 L19 13"/><path d="M5 18 L12 11 L19 18" opacity=".5"/></svg> RankUp</div>
    <p class="auth__sub">Aprende a sério. Ranks que se conquistam.</p>
    <div class="seg">
      <button id="segLogin" class="seg__btn is-active">Entrar</button>
      <button id="segReg" class="seg__btn">Criar conta</button>
    </div>
    <form id="authForm" class="auth__form">
      <input id="afName" type="text" placeholder="Nome" autocomplete="name" style="display:none" />
      <input id="afEmail" type="email" placeholder="Email" autocomplete="email" style="display:none" />
      <input id="afId" type="text" placeholder="Email ou utilizador" autocomplete="username" required />
      <input id="afPass" type="password" placeholder="Palavra-passe" autocomplete="current-password" required />
      <label class="remember"><input type="checkbox" id="afRemember" checked /> Manter sessão iniciada</label>
      <button class="btn" type="submit" id="afSubmit">Entrar</button>
      <div id="afErr" class="err"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none">
  <header class="topbar">
    <div class="brand"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13 L12 6 L19 13"/><path d="M5 18 L12 11 L19 18" opacity=".5"/></svg> RankUp</div>
    <div id="subjSel" class="subjsw" title="Disciplina"></div>
    <nav class="nav" id="nav">
      <button class="nav__i is-active" data-v="tutor"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5Z"/></svg> Learn</button>
      <button class="nav__i" data-v="practice"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0Z"/><path d="M7 6H4v1.5a3 3 0 0 0 3 3"/><path d="M17 6h3v1.5a3 3 0 0 1-3 3"/><path d="M9 19h6"/><path d="M12 13v6"/></svg> Ranked</button>
      <button class="nav__i" data-v="materials"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2Z"/><path d="M5 17.5h12"/></svg> Materiais</button>
      <button class="nav__i" data-v="duels"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></svg> Duelos<span class="nav__dot" id="duelDot" hidden></span></button>
      <button class="nav__i" data-v="admin" id="navAdmin" style="display:none"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 6v5c0 4-3 7-7 9-4-2-7-5-7-9V6Z"/></svg> Admin</button>
    </nav>
  </header>
  <aside id="rail" class="rail">
    <div class="rail__top" id="railTop"></div>
    <div class="rail__friends" id="railFriends"></div>
    <div class="rail__foot">
      <button id="logout" class="usermenu__exit" title="Terminar sessão">Sair</button>
      <div class="rail__toggle" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>

<!-- RANK-UP ANIMATION -->
<div id="rankup" class="rankup">
  <div class="rankup__box">
    <div class="rankup__ep" id="ruEp">0 EP</div>
    <div class="rankup__bar"><div class="rankup__barf" id="ruBar"></div></div>
    <div class="rankup__stage">
      <div class="rankup__ring" id="ruRing"></div>
      <div class="rankup__badge ru-from" id="ruFrom">B</div>
      <div class="rankup__badge ru-to" id="ruTo">S</div>
      <div class="rankup__spark" id="ruSpark"></div>
    </div>
    <div class="rankup__name" id="ruName"></div>
    <div class="rankup__sub" id="ruSub">Novo rank!</div>
  </div>
</div>

<div id="modal" class="modal"></div>
<div id="toast" class="toast"></div>
<script src="/app.js?v=31"></script>
</body>
</html>
