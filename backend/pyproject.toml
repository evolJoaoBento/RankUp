[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mecateca"
version = "0.1.0"
description = "MecaTeca backend — AI Socratic tutor + ranked ladder (v1)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "anthropic>=0.69",
  "httpx>=0.27",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "python-multipart>=0.0.12",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
mecateca = "mecateca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mecateca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
